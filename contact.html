<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact - Fitness Coach</title>

    <!-- เชื่อม CSS -->
    <link rel="stylesheet" href="contact.css">
</head>
<body>

    <main class="contact-container">

        <!-- ข้อมูลติดต่อด้านซ้ายมือ -->
        <section class="contact-info">
            <h2>FITNESS COACH</h2>

            <p>
                1/5 นนทบุรี  123-456-7890
            </p>

            <p>
                Tel: 123-456-7890<br>
                Fax: 123-456-7890
            </p>

            <p>
                <a href="mailto:info@DUANGTAWAN.com">
                    info@DUANGTAWAN.com
                </a>
            </p>

            <!-- Social Media -->
            <div class="social-links">
                <a href="https://facebook.com" aria-label="Facebook">f</a>
                <a href="https://twitter.com" aria-label="Twitter">♥</a>
                <a href="https://instagram.com" aria-label="Instagram">◎</a>
                <a href="https://youtube.com" aria-label="YouTube">▶</a>
            </div>
        </section>

        <!-- ฟอร์มติดต่อด้านขวา ฮาโหลๆ -->
        <section class="contact-form">
            <form action="#" method="post">

                <div class="form-group">
                    <label for="firstName">First name *</label>
                    <input type="text" id="firstName"
                           name="firstName" required>
                </div>

                <div class="form-group">
                    <label for="lastName">Last name *</label>
                    <input type="text" id="lastName"
                           name="lastName" required>
                </div>

                <div class="form-group">
                    <label for="email">Email *</label>
                    <input type="email" id="email"
                           name="email" required>
                </div>

                <div class="form-group">
                    <label for="phone">Phone</label>
                    <input type="tel" id="phone"
                           name="phone">
                </div>

                <div class="form-group">
                    <label for="message">Message</label>
                    <textarea id="message"
                              name="message"></textarea>
                </div>

                <button type="submit">Submit</button>

            </form>
        </section>

    </main>

<a href="index.html" class="back-home">← กลับหน้าแรก</a>
</body>
</html>
